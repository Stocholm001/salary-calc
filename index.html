<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <script>
    // ปิดการซูมทุกแบบบนมือถือ (iPhone Safari ไม่สนใจ user-scalable=no ต้องกันด้วย JS)
    (function () {
      var stop = function (e) { e.preventDefault(); };
      document.addEventListener('gesturestart', stop, { passive: false });
      document.addEventListener('gesturechange', stop, { passive: false });
      document.addEventListener('gestureend', stop, { passive: false });
      document.addEventListener('touchmove', function (e) {
        if (e.touches.length > 1 || (e.scale && e.scale !== 1)) e.preventDefault();
      }, { passive: false });
      document.addEventListener('dblclick', stop, { passive: false });
    })();
  </script>
  <title>กระปุกเงินเดือน</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#FFF8DC">
  <script>
    // ใส่ธีมสีที่เลือกไว้ก่อนวาดหน้า กันจอกะพริบเป็นสีเหลือง (ค่าเดียวกับ js/theme.js)
    (function () {
      var bg = { mint: '#EEF8F3', ocean: '#EEF5FC', peach: '#FFF3EC', sakura: '#FFF2F5', latte: '#F7F1E8', matcha: '#F3F6EA',
        'navy-gold': '#F5F3EE', 'teal-coral': '#EFF8F8', graphite: '#F5F5F2', midnight: '#12161F' };
      var id = null;
      try { id = localStorage.getItem('salary-calc:theme'); } catch (e) { /* ignore */ }
      if (!id || !bg.hasOwnProperty(id)) return;
      document.documentElement.setAttribute('data-theme', id);
      document.querySelector('meta[name="theme-color"]').setAttribute('content', bg[id]);
    })();
  </script>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="กระปุกเงินเดือน">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/themes.css">
</head>
<body>
  <div id="app"></div>
  <noscript>ต้องเปิด JavaScript เพื่อใช้งานกระปุกเงินเดือน</noscript>
  <script>
    // กันหน้าว่าง: ถ้าโค้ดแอปโหลดไม่สำเร็จ (เช่น เบราว์เซอร์ใช้ไฟล์เก่าในแคชปนกับไฟล์ใหม่)
    // ให้แสดงข้อความพร้อมปุ่ม "โหลดใหม่" ที่ล้างแคชของไฟล์แอปก่อนรีเฟรช
    (function () {
      function showLoadError() {
        if (window.__appStarted || document.getElementById('boot-fail')) return;
        var app = document.getElementById('app');
        if (!app || app.childElementCount) return;
        app.innerHTML =
          '<main class="login" id="boot-fail"><div class="login__hero">' +
          '<h1 class="login__title">กระปุกเงินเดือน</h1>' +
          '<p class="login__sub">โหลดแอปไม่สำเร็จ กดโหลดใหม่อีกครั้ง<br>Couldn’t load the app. Tap reload.</p></div>' +
          '<button type="button" class="btn btn--primary btn--block" id="boot-reload">โหลดใหม่ / Reload</button></main>';
        document.getElementById('boot-reload').onclick = hardReload;
      }
      function hardReload() {
        var btn = document.getElementById('boot-reload');
        btn.disabled = true;
        // ดึงรายชื่อไฟล์แอปจาก sw.js แล้วโหลดใหม่จากเซิร์ฟเวอร์ทุกไฟล์ (ข้ามแคช) ก่อนรีเฟรช
        var clearSw = 'caches' in window
          ? caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })
          : Promise.resolve();
        clearSw
          .then(function () { return fetch('sw.js', { cache: 'reload' }); })
          .then(function (r) { return r.text(); })
          .then(function (txt) {
            var files = (txt.match(/'\.\/[^']+'/g) || []).map(function (s) { return s.slice(1, -1); });
            return Promise.all(files.map(function (f) { return fetch(f, { cache: 'reload' }).catch(function () {}); }));
          })
          .catch(function () {})
          .then(function () { location.reload(); });
      }
      window.addEventListener('error', function () { setTimeout(showLoadError, 0); });
      window.addEventListener('load', function () { setTimeout(showLoadError, 8000); });
    })();
  </script>
  <script type="module" src="js/app.js" onerror="setTimeout(function(){window.dispatchEvent(new Event('error'))},0)"></script>
</body>
</html>
